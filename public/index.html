function Timer({seconds,onComplete,color}){
  const[rem,setRem]=useState(seconds);
  const[run,setRun]=useState(true);
  const iv=useRef(null),st=useRef(Date.now());
  useEffect(()=>{
    if(!run)return;
    st.current=Date.now()-(seconds-rem)*1000;
    iv.current=setInterval(()=>{
      const r=Math.max(0,seconds-Math.floor((Date.now()-st.current)/1000));
      setRem(r);if(r===0){clearInterval(iv.current);onComplete?.();}
    },100);
    return()=>clearInterval(iv.current);
  },[run]);
  const pct=((seconds-rem)/seconds)*100,m=Math.floor(rem/60),s=rem%60,done=rem===0;
  return(
    <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:100,background:done?"#16A34A":"#111",borderTop:`3px solid ${color}`,padding:"12px 20px max(20px, env(safe-area-inset-bottom))",display:"flex",alignItems:"center",gap:16}}>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"baseline",gap:8}}>
          <span style={{fontFamily:"'JetBrains Mono','SF Mono',monospace",fontSize:done?28:40,fontWeight:700,color:"#fff",letterSpacing:2,lineHeight:1}}>{done?"GO!":`${m}:${String(s).padStart(2,"0")}`}</span>
          {!done&&<span style={{fontSize:13,color:"rgba(255,255,255,0.5)"}}>rest</span>}
        </div>
        <div style={{height:4,borderRadius:2,background:"rgba(255,255,255,0.15)",marginTop:8,overflow:"hidden"}}><div style={{height:"100%",borderRadius:2,background:color,width:`${pct}%`,transition:"width 0.3s linear"}}/></div>
      </div>
      <div style={{display:"flex",gap:8}}>
        {!done&&<button onClick={()=>setRun(!run)} style={{width:44,height:44,borderRadius:22,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.1)",color:"#fff",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{run?"\u23F8":"\u25B6"}</button>}
        <button onClick={()=>{clearInterval(iv.current);onComplete?.();}} style={{width:44,height:44,borderRadius:22,border:"none",background:done?"#fff":color,color:done?"#111":"#fff",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{done?"\u2192":"Skip"}</button>
      </div>
    </div>
  );
}

function Badge({id}){const g=AG[id];if(!g)return null;const c=MC[g.method];return <span style={{fontSize:9,fontWeight:700,letterSpacing:0.8,padding:"2px 6px",borderRadius:4,background:c.bg,color:c.color,whiteSpace:"nowrap"}}>{c.label}</span>;}

function SetRow({n,reps,done,onToggle,wt,onWt,ar,onAr}){
  return(
    <div onClick={onToggle} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.06)",cursor:"pointer",opacity:done?0.5:1,transition:"opacity 0.2s"}}>

      <div style={{flex:1}}><span style={{fontSize:14,color:"rgba(255,255,255,0.6)"}}>Set {n}</span></div>
      <div style={{display:"flex",alignItems:"center",gap:6}} onClick={e=>e.stopPropagation()}>
        <input type="number" value={wt} onChange={e=>onWt(e.target.value)} placeholder="kg" style={{width:52,padding:"5px 4px",borderRadius:6,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:14,textAlign:"center",fontFamily:"monospace",outline:"none"}}/>
        <span style={{color:"rgba(255,255,255,0.3)",fontSize:12}}>\u00D7</span>
        <input type="text" value={ar} onChange={e=>onAr(e.target.value)} placeholder={reps} style={{width:44,padding:"5px 4px",borderRadius:6,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:14,textAlign:"center",fontFamily:"monospace",outline:"none"}}/>
      </div>
    </div>
  );
}

function ExCard({ex,color,onTimer,cs,sd,onToggle,onSD,onGuide}){
  const[exp,setExp]=useState(false);
  const allDone=cs.length===ex.sets,any=cs.length>0,g=AG[ex.id];
  return(
    <div style={{background:"rgba(255,255,255,0.04)",borderRadius:12,border:`1px solid ${allDone?"rgba(22,163,106,0.3)":"rgba(255,255,255,0.08)"}`,overflow:"hidden"}}>
      <div onClick={()=>setExp(!exp)} style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
        <div style={{width:6,height:32,borderRadius:3,flexShrink:0,background:allDone?"#16A34A":any?color:"rgba(255,255,255,0.15)"}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <span style={{fontSize:15,fontWeight:ex.primary?700:500,color:"#fff",textDecoration:allDone?"line-through":"none",textDecorationColor:"rgba(255,255,255,0.3)"}}>{ex.name}</span>
            <Badge id={ex.id}/>
          </div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginTop:2}}>{ex.sets}\u00D7{ex.reps} \u00B7 {ex.rest>0?`${ex.rest}s`:"No rest"}{g?` \u00B7 ${g.milestone}`:""}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <span style={{fontSize:12,color:"rgba(255,255,255,0.3)",fontFamily:"monospace"}}>{cs.length}/{ex.sets}</span>
          <span style={{fontSize:12,color:"rgba(255,255,255,0.3)",transform:exp?"rotate(180deg)":"none",transition:"transform 0.2s"}}>\u25BE</span>
        </div>
      </div>
      {exp&&(
        <div style={{padding:"0 16px 14px"}}>
          {g&&<div onClick={e=>{e.stopPropagation();onGuide?.(ex.id);}} style={{padding:"8px 10px",borderRadius:8,marginBottom:10,cursor:"pointer",background:MC[g.method].bg,border:`1px solid ${MC[g.method].color}22`}}>
            <div style={{fontSize:11,color:MC[g.method].color,fontWeight:600,marginBottom:2}}>{g.method==="double"?"\u2191 Hit top of rep range \u2192 add weight \u2192 drop":g.method==="bw"?`\u2191 Build to threshold \u2192 add ${g.increment}`:g.method==="quality"?"\u25CE Focus on control, not weight":g.method==="linear"?`\u2191 Add ${g.increment} every 2-3 weeks`:"Follows programme table"}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>Tap for full guide <span style={{color:MC[g.method].color}}>\u2192</span></div>
          </div>}

        </div>
      )}
    </div>
  );
}

    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#1A1A1A",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",maxWidth:420,width:"100%",border:"1px solid rgba(255,255,255,0.1)",borderBottom:"none",maxHeight:"70vh",overflowY:"auto"}}>

          <div style={{fontSize:12,fontWeight:700,color:"#60A5FA",marginBottom:8}}>Double Progression</div>

    (async()=>{
      try{
        const[settings,workouts]=await Promise.all([API.get("/settings"),API.get("/workouts?limit=20")]);
        if(settings.current_week)setCw(parseInt(settings.current_week));
        setHist(workouts.map(w=>({id:w.id,day:w.day_name,date:w.started_at?.split("T")[0]||w.started_at,completed:w.completed_sets,total:w.total_sets})));
      }catch(e){console.error("Failed to load:",e);}
      setLoading(false);
    })();
  },[]);

  // Save current week when it changes
  useEffect(()=>{if(!loading)API.put("/settings/current_week",{value:String(cw)}).catch(()=>{});},  [cw]);

  const startW=async(k)=>{
    const d=PROG_DATA[k];
    try{const r=await API.post("/workouts",{day_key:k,day_name:d.name});setWid(r.id);}catch(e){console.error(e);}
    setAd(k);setCs({});setSd({});setScr("workout");setSf(false);
  };

  const togS=(eid,si)=>setCs(p=>{const c=p[eid]||[];return c.includes(si)?{...p,[eid]:c.filter(s=>s!==si)}:{...p,[eid]:[...c,si]};});
  const upSD=(eid,si,f,v)=>setSd(p=>({...p,[eid]:{...(p[eid]||{}),[si]:{...(p[eid]?.[si]||{}),[f]:v}}}));
  const startT=useCallback(s=>{if(ad)setTc(PROG_DATA[ad].color);setTs(s);},[ad]);

  const finW=async()=>{
    const d=PROG_DATA[ad];
    const t=d.sections.reduce((s,x)=>s+x.exercises.reduce((a,e)=>a+e.sets,0),0);
    const dn=Object.values(cs).reduce((s,a)=>s+a.length,0);

    if(wid){
      try{
        // Save all sets
        const sets=[];
        for(const sec of d.sections){
          for(const ex of sec.exercises){
            for(let i=0;i<ex.sets;i++){
              const data=sd[ex.id]?.[i]||{};
              sets.push({exercise_id:ex.id,exercise_name:ex.name,set_number:i+1,weight:data.weight?parseFloat(data.weight):null,reps:data.reps||null,completed:(cs[ex.id]||[]).includes(i)});
            }
          }
        }
        await API.post(`/workouts/${wid}/sets`,{sets});
        await API.put(`/workouts/${wid}/finish`,{completed_sets:dn,total_sets:t});

        // Check for PRs on completed sets with weight
        for(const s of sets){
          if(s.completed&&s.weight&&s.weight>0){
            API.post("/prs",{exercise_id:s.exercise_id,exercise_name:s.exercise_name,weight:s.weight,reps:s.reps||""}).catch(()=>{});
          }
        }
      }catch(e){console.error("Failed to save:",e);}
    }

    setHist(p=>[{id:wid,day:d.name,date:new Date().toISOString().split("T")[0],completed:dn,total:t},...p]);
    setScr("home");setAd(null);setTs(null);setWid(null);
  };

  const day=ad?PROG_DATA[ad]:null;
  const tES=day?day.sections.reduce((s,x)=>s+x.exercises.reduce((a,e)=>a+e.sets,0),0):0;
  const tD=Object.values(cs).reduce((s,a)=>s+a.length,0);

  if(loading)return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0A0A0A",color:"rgba(255,255,255,0.5)",fontSize:14}}>Loading...</div>;

  // ── HOME ──
  if(scr==="home"){
    return(
      <div style={{minHeight:"100vh",background:"linear-gradient(180deg,#0A0A0A 0%,#111 100%)",color:"#fff",fontFamily:"inherit",paddingBottom:80}}>
        <div style={{padding:"max(48px, calc(env(safe-area-inset-top) + 16px)) 20px 20px"}}>
          <div style={{fontSize:12,fontWeight:600,letterSpacing:3,color:"rgba(255,255,255,0.35)",textTransform:"uppercase"}}>Road to</div>
          <div style={{fontSize:48,fontWeight:800,lineHeight:1,background:"linear-gradient(135deg,#fff 40%,#60A5FA)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>100kg</div>
          <div style={{fontSize:14,color:"rgba(255,255,255,0.5)",marginTop:4}}>Bench Press Programme</div>
        </div>
        <div style={{padding:"0 20px",marginBottom:24}}>
          <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,border:"1px solid rgba(255,255,255,0.08)",padding:"16px 18px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.4)",fontWeight:600,letterSpacing:1}}>CURRENT PHASE</span>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setCw(Math.max(0,cw-1))} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#fff",borderRadius:6,width:28,height:28,cursor:"pointer",fontSize:14}}>{"\u2039"}</button>
                <button onClick={()=>setCw(Math.min(WEEKS.length-1,cw+1))} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#fff",borderRadius:6,width:28,height:28,cursor:"pointer",fontSize:14}}>{"\u203A"}</button>
              </div>
            </div>
            <div style={{fontSize:18,fontWeight:700}}>{WEEKS[cw].week}</div>
            <div style={{display:"flex",gap:24,marginTop:10}}>
              <div><div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:2}}>Bench</div><div style={{fontSize:20,fontWeight:700,fontFamily:"monospace",color:"#60A5FA"}}>{WEEKS[cw].bench}</div></div>
              <div><div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:2}}>Squat</div><div style={{fontSize:20,fontWeight:700,fontFamily:"monospace",color:"#34D399"}}>{WEEKS[cw].squat}</div></div>
              <div><div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:2}}>Phase</div><div style={{fontSize:13,fontWeight:600,marginTop:4,padding:"3px 10px",borderRadius:20,background:WEEKS[cw].phase==="TEST"?"rgba(234,179,8,0.15)":"rgba(255,255,255,0.06)",color:WEEKS[cw].phase==="TEST"?"#FBBF24":"rgba(255,255,255,0.6)",display:"inline-block"}}>{WEEKS[cw].phase}</div></div>
            </div>
            <div style={{marginTop:14,height:4,borderRadius:2,background:"rgba(255,255,255,0.08)"}}><div style={{height:"100%",borderRadius:2,background:"linear-gradient(90deg,#2563EB,#60A5FA)",width:`${((cw+1)/WEEKS.length)*100}%`,transition:"width 0.3s"}}/></div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:4}}>Week {cw+1} of {WEEKS.length}</div>
          </div>
        </div>
        <div style={{padding:"0 20px"}}>
          <div style={{fontSize:12,fontWeight:600,letterSpacing:2,color:"rgba(255,255,255,0.35)",marginBottom:12,textTransform:"uppercase"}}>Start Workout</div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {Object.entries(PROG_DATA).map(([k,d])=>(<button key={k} onClick={()=>startW(k)} style={{display:"flex",alignItems:"center",gap:14,padding:"16px 18px",background:"rgba(255,255,255,0.04)",borderRadius:14,border:"1px solid rgba(255,255,255,0.08)",cursor:"pointer",textAlign:"left"}}>
              <div style={{width:44,height:44,borderRadius:12,background:`${d.color}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{d.icon}</div>
              <div style={{flex:1}}><div style={{fontSize:16,fontWeight:600,color:"#fff"}}>{d.name}</div><div style={{fontSize:13,color:"rgba(255,255,255,0.45)"}}>{d.subtitle}</div></div>
              <div style={{color:d.color,fontSize:20}}>{"\u2192"}</div>
            </button>))}
          </div>
        </div>
        <div style={{padding:"24px 20px",display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
          <button onClick={()=>setScr("progress")} style={{background:"none",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.5)",padding:"10px 20px",borderRadius:20,cursor:"pointer",fontSize:13,fontWeight:500}}>Progression Table</button>
          <button onClick={()=>setScr("guide")} style={{background:"none",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.5)",padding:"10px 20px",borderRadius:20,cursor:"pointer",fontSize:13,fontWeight:500}}>Accessory Guide</button>
          <a href="/api/export" style={{background:"none",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.5)",padding:"10px 20px",borderRadius:20,cursor:"pointer",fontSize:13,fontWeight:500,textDecoration:"none"}}>Export Data</a>
        </div>
        {hist.length>0&&<div style={{padding:"0 20px"}}><div style={{fontSize:12,fontWeight:600,letterSpacing:2,color:"rgba(255,255,255,0.35)",marginBottom:12,textTransform:"uppercase"}}>Recent</div>
          {hist.slice(0,10).map((h,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
            <div><span style={{fontSize:14,color:"#fff",fontWeight:500}}>{h.day}</span><span style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginLeft:8}}>{h.date}</span></div>
            <span style={{fontSize:13,color:"rgba(255,255,255,0.4)",fontFamily:"monospace"}}>{h.completed}/{h.total}</span>
          </div>))}
        </div>}
      </div>
    );
  }

  // ── GUIDE ──
  if(scr==="guide"){
    const gr={};for(const[dk,dd]of Object.entries(PROG_DATA))for(const s of dd.sections)for(const e of s.exercises)if(AG[e.id]){if(!gr[dk])gr[dk]={...dd,exercises:[]};gr[dk].exercises.push({...e,guide:AG[e.id]});}
    return(<div style={{minHeight:"100vh",background:"#0A0A0A",color:"#fff",fontFamily:"inherit"}}>
      <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid rgba(255,255,255,0.08)",position:"sticky",top:0,background:"#0A0A0A",zIndex:10}}>
        <button onClick={()=>setScr("home")} style={{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer",padding:4}}>{"\u2190"}</button>
        <span style={{fontSize:17,fontWeight:600}}>Accessory Progression Guide</span>
      </div>
      <div style={{padding:"16px 20px 8px",display:"flex",flexWrap:"wrap",gap:8}}>{Object.entries(MC).map(([k,c])=><div key={k} style={{padding:"4px 10px",borderRadius:6,background:c.bg}}><span style={{fontSize:10,fontWeight:700,color:c.color}}>{c.label}</span></div>)}</div>
      <div style={{padding:"8px 20px 40px"}}>{Object.entries(gr).map(([dk,dd])=>(<div key={dk} style={{marginBottom:24}}>
        <div style={{fontSize:14,fontWeight:700,color:dd.color,padding:"10px 0",borderBottom:`2px solid ${dd.color}30`,marginBottom:12}}>{dd.icon} {dd.name} - {dd.subtitle}</div>
        {dd.exercises.map(ex=>{const c=MC[ex.guide.method];return(<div key={ex.id} style={{background:"rgba(255,255,255,0.03)",borderRadius:12,border:"1px solid rgba(255,255,255,0.06)",padding:"14px 16px",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:15,fontWeight:600}}>{ex.name}</span><span style={{fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4,background:c.bg,color:c.color}}>{c.label}</span></div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.6)",lineHeight:1.5,marginBottom:8}}>{ex.guide.tip}</div>
          <div style={{display:"flex",gap:10}}>
            <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"8px 10px",flex:1}}><div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>Reps</div><div style={{fontSize:14,fontWeight:700,fontFamily:"monospace"}}>{ex.guide.repRange}</div></div>
            <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"8px 10px",flex:1}}><div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>Jump</div><div style={{fontSize:14,fontWeight:700,fontFamily:"monospace"}}>{ex.guide.increment}</div></div>
            <div style={{background:c.bg,borderRadius:8,padding:"8px 10px",flex:1.5}}><div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>Target</div><div style={{fontSize:13,fontWeight:700,color:c.color}}>{ex.guide.milestone}</div></div>
          </div>
        </div>);})}
      </div>))}</div>
    </div>);
  }

  // ── PROGRESS ──
  if(scr==="progress"){
    return(<div style={{minHeight:"100vh",background:"#0A0A0A",color:"#fff",fontFamily:"inherit"}}>
      <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid rgba(255,255,255,0.08)",position:"sticky",top:0,background:"#0A0A0A",zIndex:10}}>
        <button onClick={()=>setScr("home")} style={{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer",padding:4}}>{"\u2190"}</button>
        <span style={{fontSize:17,fontWeight:600}}>Progression Table</span>
      </div>
      <div style={{padding:16,overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr>{["Week","Bench","Squat","Phase"].map(h=><th key={h} style={{padding:"10px 8px",textAlign:"left",borderBottom:"2px solid rgba(255,255,255,0.15)",color:"rgba(255,255,255,0.5)",fontWeight:600,fontSize:11,letterSpacing:1}}>{h}</th>)}</tr></thead>
          <tbody>{WEEKS.map((r,i)=>(<tr key={i} style={{background:i===cw?"rgba(37,99,235,0.1)":"transparent"}}>
            <td style={{padding:"10px 8px",fontWeight:i===cw?700:400,whiteSpace:"nowrap",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>{i===cw&&"\u25B8 "}{r.week}</td>
            <td style={{padding:"10px 8px",fontFamily:"monospace",color:"#60A5FA",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>{r.bench}</td>
            <td style={{padding:"10px 8px",fontFamily:"monospace",color:"#34D399",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>{r.squat}</td>
            <td style={{padding:"10px 8px",borderBottom:"1px solid rgba(255,255,255,0.05)"}}><span style={{padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:600,background:r.phase==="TEST"?"rgba(234,179,8,0.15)":r.phase==="Recovery"?"rgba(34,197,94,0.15)":"rgba(255,255,255,0.06)",color:r.phase==="TEST"?"#FBBF24":r.phase==="Recovery"?"#34D399":"rgba(255,255,255,0.6)"}}>{r.phase}</span></td>
          </tr>))}</tbody>
        </table>
      </div>
    </div>);
  }

  // ── WORKOUT ──
  return(<div style={{minHeight:"100vh",background:"#0A0A0A",color:"#fff",fontFamily:"inherit",paddingBottom:ts!==null?100:80}}>
    <div style={{position:"sticky",top:0,zIndex:50,background:"#0A0A0A",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"14px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>{if(tD>0&&!sf){setSf(true);return;}setScr("home");setAd(null);setTs(null);setWid(null);}} style={{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer",padding:4}}>{"\u2190"}</button>
          <div><div style={{fontSize:17,fontWeight:700}}>{day.name}</div><div style={{fontSize:12,color:"rgba(255,255,255,0.4)"}}>{day.subtitle}</div></div>
        </div>
        <div style={{fontSize:13,fontFamily:"monospace",color:day.color,background:`${day.color}15`,padding:"4px 12px",borderRadius:20,fontWeight:600}}>{tD}/{tES}</div>
      </div>
      <div style={{height:3,borderRadius:2,background:"rgba(255,255,255,0.08)",marginTop:10}}><div style={{height:"100%",borderRadius:2,background:day.color,width:tES>0?`${(tD/tES)*100}%`:"0%",transition:"width 0.3s"}}/></div>
    </div>

    {sf&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#1A1A1A",borderRadius:20,padding:24,maxWidth:320,width:"100%",border:"1px solid rgba(255,255,255,0.1)"}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Finish Workout?</div>
        <div style={{fontSize:14,color:"rgba(255,255,255,0.5)",marginBottom:20}}>You've completed {tD}/{tES} sets.</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setSf(false)} style={{flex:1,padding:"12px 0",borderRadius:12,border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>Keep Going</button>
          <button onClick={finW} style={{flex:1,padding:"12px 0",borderRadius:12,border:"none",background:day.color,color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>Finish</button>
        </div>
      </div>
    </div>}

    {gid&&<GuideModal id={gid} onClose={()=>setGid(null)}/>}

    <div style={{padding:"16px 20px"}}>
      {day.sections.map((sec,si)=>(<div key={si} style={{marginBottom:24}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:2,color:"rgba(255,255,255,0.3)",textTransform:"uppercase",marginBottom:10,paddingLeft:2}}>{sec.name}</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {sec.exercises.map(ex=><ExCard key={ex.id} ex={ex} color={day.color} cs={cs[ex.id]||[]} sd={sd[ex.id]||{}} onToggle={si=>togS(ex.id,si)} onSD={(si,f,v)=>upSD(ex.id,si,f,v)} onTimer={startT} onGuide={id=>setGid(id)}/>)}
        </div>
      </div>))}
      <button onClick={finW} style={{width:"100%",padding:"16px 0",borderRadius:14,border:"none",background:tD===tES?day.color:"rgba(255,255,255,0.06)",color:tD===tES?"#fff":"rgba(255,255,255,0.4)",fontSize:16,fontWeight:700,cursor:"pointer",marginTop:8}}>{tD===tES?"Complete Workout \u2713":"Finish Early"}</button>
    </div>

    {ts!==null&&<Timer key={ts+Date.now()} seconds={ts} color={tc} onComplete={()=>setTs(null)}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
